x-kafka: &kafka
  image: apache/kafka:3.9.1
  restart: unless-stopped
  healthcheck:
    test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
    interval: 10s
    timeout: 10s
    retries: 12
    start_period: 20s

x-kafka-env: &kafka-env
  CLUSTER_ID: 5L6g3nShT-eMCtK--X86sw
  KAFKA_PROCESS_ROLES: broker,controller
  KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
  KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
  KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
  KAFKA_LOG_DIRS: /tmp/kraft-logs
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
  KAFKA_DEFAULT_REPLICATION_FACTOR: 3
  KAFKA_MIN_INSYNC_REPLICAS: 2
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

x-go-service: &go-service
  restart: unless-stopped
  healthcheck:
    test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
    interval: 10s
    timeout: 5s
    retries: 6

services:
  kafka-1:
    <<: *kafka
    hostname: kafka-1
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 1
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-1:9092

  kafka-2:
    <<: *kafka
    hostname: kafka-2
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 2
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-2:9092

  kafka-3:
    <<: *kafka
    hostname: kafka-3
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 3
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-3:9092

  kafka-init:
    image: apache/kafka:3.9.1
    entrypoint: ["/bin/bash", "/create-topic.sh"]
    volumes:
      - ./infra/kafka/create-topic.sh:/create-topic.sh:ro
    depends_on:
      kafka-1: { condition: service_healthy }
      kafka-2: { condition: service_healthy }
      kafka-3: { condition: service_healthy }

  schema-registry:
    image: confluentinc/cp-schema-registry:7.8.0
    restart: unless-stopped
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka-1:9092,PLAINTEXT://kafka-2:9092,PLAINTEXT://kafka-3:9092
      SCHEMA_REGISTRY_KAFKASTORE_TOPIC_REPLICATION_FACTOR: 3
    ports:
      - "18081:8081"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8081/subjects"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    depends_on:
      kafka-1: { condition: service_healthy }
      kafka-2: { condition: service_healthy }
      kafka-3: { condition: service_healthy }

  schema-init:
    build: { context: ., args: { CMD: register-schema } }
    environment:
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
    depends_on:
      schema-registry: { condition: service_healthy }

  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    restart: unless-stopped
    environment:
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: clickhouse
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "8123:8123"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  clickhouse-migrate:
    image: clickhouse/clickhouse-server:25.8
    entrypoint:
      - /bin/bash
      - -c
      - |
        set -e
        for f in /migrations/*.sql; do
          echo "applying $$f"
          clickhouse-client --host clickhouse --password clickhouse --multiquery < "$$f"
        done
    volumes:
      - ./clickhouse/migrations:/migrations:ro
    depends_on:
      clickhouse: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }
      schema-init: { condition: service_completed_successfully }

  producer:
    <<: *go-service
    build: { context: ., args: { CMD: producer } }
    environment:
      KAFKA_BROKERS: kafka-1:9092,kafka-2:9092,kafka-3:9092
      KAFKA_TOPIC: movie-events
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      GENERATOR_ENABLED: "true"
      GENERATOR_EVENTS_PER_SECOND: "5"
      GENERATOR_BACKFILL_DAYS: "14"
    ports:
      - "8080:8080"
    depends_on:
      kafka-init: { condition: service_completed_successfully }
      schema-init: { condition: service_completed_successfully }

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: metrics
      POSTGRES_PASSWORD: metrics
      POSTGRES_DB: metrics
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "metrics", "-d", "metrics"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    restart: unless-stopped
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  aggregator:
    <<: *go-service
    build: { context: ., args: { CMD: aggregator } }
    environment:
      CLICKHOUSE_ADDR: clickhouse:9000
      CLICKHOUSE_DB: cinema
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: clickhouse
      POSTGRES_DSN: postgres://metrics:metrics@postgres:5432/metrics
      S3_ENDPOINT: minio:9000
      S3_ACCESS_KEY: minio
      S3_SECRET_KEY: minio12345
      S3_BUCKET: movie-analytics
      AGGREGATION_INTERVAL: 1m
      AGGREGATION_LOOKBACK_DAYS: "14"
      EXPORT_INTERVAL: 1h
    ports:
      - "8090:8080"
    depends_on:
      clickhouse-migrate: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }
      minio: { condition: service_healthy }

  grafana:
    image: grafana/grafana:12.2.0
    restart: unless-stopped
    environment:
      GF_INSTALL_PLUGINS: grafana-clickhouse-datasource
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    depends_on:
      clickhouse-migrate: { condition: service_completed_successfully }

  tests:
    image: golang:1.26-alpine
    profiles: [test]
    working_dir: /src
    command: ["go", "test", "-tags", "integration", "-count=1", "-v", "./tests/..."]
    environment:
      CGO_ENABLED: "0"
      PRODUCER_URL: http://producer:8080
      AGGREGATOR_URL: http://aggregator:8080
      CLICKHOUSE_ADDR: clickhouse:9000
      CLICKHOUSE_PASSWORD: clickhouse
      POSTGRES_DSN: postgres://metrics:metrics@postgres:5432/metrics
      S3_ENDPOINT: minio:9000
      S3_ACCESS_KEY: minio
      S3_SECRET_KEY: minio12345
      S3_BUCKET: movie-analytics
    volumes:
      - .:/src
      - go-cache:/go/pkg/mod
    depends_on:
      producer: { condition: service_healthy }
      aggregator: { condition: service_healthy }

volumes:
  clickhouse-data:
  postgres-data:
  minio-data:
  go-cache:
